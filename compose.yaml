# Host stack: db + backend + standalone API ingress + front (nginx).
# App services (backend, api-ingress, front) are gated behind the `full` profile so the default
# `docker compose up` / `pnpm backend:db:up` brings up db only (daily dev is native hot reload).
# Bring up the whole host stack with `docker compose --profile full up -d --build`.
#
# PostgreSQL for dev/prod parity. Prisma's provider is locked to postgresql; dev and prod differ only by DATABASE_URL.
# DB role separation:
#   fall     = superuser      → migrations, seed (DIRECT_URL)
#   fall_app = NOSUPERUSER NOBYPASSRLS → application runtime (DATABASE_URL)
#
# First-time setup requires a clean volume so initdb scripts run:
#   docker compose down -v && pnpm backend:db:up
services:
  db:
    image: postgres:17-alpine
    container_name: eldercare-fall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fall}
      POSTGRES_DB: ${POSTGRES_DB:-fall_dev}
      APP_DB_USER: ${APP_DB_USER:-fall_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-fall_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only on first DB initialization (clean volume required).
      - ./backend/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fall} -d ${POSTGRES_DB:-fall_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private_ingress

  backend:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    environment:
      PORT: 8080
      # Runtime uses the fall_app NOSUPERUSER/NOBYPASSRLS role so RLS is enforced.
      DATABASE_URL: postgresql://${APP_DB_USER:-fall_app}:${APP_DB_PASSWORD:-fall_app}@db:5432/${POSTGRES_DB:-fall_dev}?schema=public
      # DIRECT_URL keeps the privileged fall superuser for migrations / seed only.
      DIRECT_URL: postgresql://${POSTGRES_USER:-fall}:${POSTGRES_PASSWORD:-fall}@db:5432/${POSTGRES_DB:-fall_dev}?schema=public
      FRONT_ORIGIN: http://localhost:3000
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:-dev-only-session-secret-change-me-32chars-min}
      EDGE_TOKEN_PEPPER: ${EDGE_TOKEN_PEPPER:-}
      # Fail-closed by default: only the literal string 'true' activates the
      # deprecated shared-token fallback, and only for the migration window
      # of an Edge that has not yet enrolled eft_v1 credentials. When
      # enabled, EDGE_LEGACY_FACILITY_ID must also be set — the legacy path
      # never trusts a client-supplied facility scope.
      EDGE_LEGACY_COMPAT_ENABLED: ${EDGE_LEGACY_COMPAT_ENABLED:-}
      EDGE_LEGACY_FACILITY_ID: ${EDGE_LEGACY_FACILITY_ID:-}
      # SMTP_* configures outbound alert email delivery (nodemailer). Dev placeholders
      # point at a local/dummy SMTP host; override with real Gmail app-password creds in prod.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Shared bearer token for remote Event API producers.
      EDGE_FACILITY_TOKEN: ${EDGE_FACILITY_TOKEN:-dev-only-edge-facility-token-change-me}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_ingress

  api-ingress:
    profiles: [full]
    build:
      context: .
      dockerfile: infra/api-ingress/Dockerfile
    ports:
      - "127.0.0.1:${API_INGRESS_PORT:-3001}:3000"
    depends_on:
      - backend

  front:
    profiles: [full]
    build:
      context: .
      dockerfile: front/Dockerfile
      target: runner
    # nginx serves the built SPA and reverse-proxies /api to the
    # backend (same-origin), so no NEXT_PUBLIC_*/API_INTERNAL_URL is needed.
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - private_ingress

networks:
  # Nest trusts forwarded protocol only from this immediate private ingress
  # network. Production keeps Nest unexposed; nginx is the public HTTP hop.
  private_ingress:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
