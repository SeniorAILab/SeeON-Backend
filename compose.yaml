# Host stack (single host): db + backend + front(nginx). ML runs on the external
# edge device — see compose.edge.yaml (ML inference pushes signed events to the
# backend /ingest endpoint, so ml-serving is not part of this stack).
# App services (backend, front) are gated behind the `full` profile so the default
# `docker compose up` / `pnpm db:up` brings up db only (daily dev is native hot reload).
# Bring up the whole host stack with `docker compose --profile full up -d --build`.
#
# PostgreSQL for dev/prod parity. Prisma's provider is locked to postgresql; dev and prod differ only by DATABASE_URL.
# DB role separation:
#   fall     = superuser      → migrations, seed (DIRECT_URL)
#   fall_app = NOSUPERUSER NOBYPASSRLS → application runtime (DATABASE_URL)
#
# First-time setup requires a clean volume so initdb scripts run:
#   docker compose down -v && docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: eldercare-fall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fall}
      POSTGRES_DB: ${POSTGRES_DB:-fall_dev}
      APP_DB_USER: ${APP_DB_USER:-fall_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-fall_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only on first DB initialization (clean volume required).
      - ./backend/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fall} -d ${POSTGRES_DB:-fall_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    environment:
      PORT: 8080
      # Runtime uses the fall_app NOSUPERUSER/NOBYPASSRLS role so RLS is enforced.
      DATABASE_URL: postgresql://${APP_DB_USER:-fall_app}:${APP_DB_PASSWORD:-fall_app}@db:5432/${POSTGRES_DB:-fall_dev}?schema=public
      # DIRECT_URL keeps the privileged fall superuser for migrations / seed only.
      DIRECT_URL: postgresql://${POSTGRES_USER:-fall}:${POSTGRES_PASSWORD:-fall}@db:5432/${POSTGRES_DB:-fall_dev}?schema=public
      # ML_SERVING_URL is intentionally absent: ML runs on the edge and pushes to /ingest.
      # The backend MlServingPredictionAdapter pull seam stays dormant;
      # set ML_SERVING_URL only if a future topology re-enables backend-pull prediction.
      FRONT_ORIGIN: http://localhost:3000
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-dev-placeholder-kakao-rest-api-key}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8080/auth/kakao/callback}
      KAKAO_SCOPES: ${KAKAO_SCOPES:-}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:-dev-only-session-secret-change-me-32chars-min}
      # KAKAO_TOKEN_ENC_KEY encrypts per-user Kakao access tokens at rest (AES-256-GCM).
      # Dev placeholder is a fixed 32-byte hex key; override with a real random key in prod.
      KAKAO_TOKEN_ENC_KEY: ${KAKAO_TOKEN_ENC_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    profiles: [full]
    build:
      context: .
      dockerfile: front/Dockerfile
      target: runner
    # nginx serves the built SPA and reverse-proxies /api, /auth, /ingest to the
    # backend (same-origin), so no NEXT_PUBLIC_*/API_INTERNAL_URL is needed.
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
