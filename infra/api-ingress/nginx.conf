# Standalone API-only ingress. Static assets and SPA routing remain owned by front.
server {
  listen 3000;
  server_name _;
  resolver 127.0.0.11 valid=30s;
  set $backend_upstream http://backend:8080;

  location = /health {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Edge-Relay-Token $http_x_edge_relay_token;
  }

  # Dashboard SSE must reach clients as each event is emitted.
  location = /api/v1/dashboard/stream {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Edge-Relay-Token $http_x_edge_relay_token;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-cache" always;
  }

  # Edge clip uploads are streamed and may be at most 256 MiB.
  location ~ ^/api/v1/events/clips/[^/]+$ {
    client_max_body_size 268435456;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Edge-Relay-Token $http_x_edge_relay_token;
    proxy_request_buffering off;
    proxy_cache off;
  }

  # Preserve authenticated media byte-range semantics without nginx temp files.
  location ~ ^/api/v1/alerts/[^/]+/media/content$ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Edge-Relay-Token $http_x_edge_relay_token;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
  }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Edge-Relay-Token $http_x_edge_relay_token;
  }

  location / {
    return 404;
  }
}
