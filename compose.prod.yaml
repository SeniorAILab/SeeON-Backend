# Production overlay for the host stack (db + backend + front[nginx]).
services:
  db:
    ports: !reset []
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in prod}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required in prod}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required in prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required in prod} -d ${POSTGRES_DB:?POSTGRES_DB is required in prod}"]

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required in prod}
    build: !reset null
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in prod}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required in prod}
      FRONT_ORIGINS: ${FRONT_ORIGINS:?FRONT_ORIGINS is required in prod}
      # Singular compatibility fallback only; FRONT_ORIGINS above always wins.
      FRONT_ORIGIN: ${FRONT_ORIGIN:-}
      ALERT_DASHBOARD_URL: ${ALERT_DASHBOARD_URL:?ALERT_DASHBOARD_URL is required in prod}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?SESSION_JWT_SECRET is required in prod}
      EDGE_TOKEN_PEPPER: ${EDGE_TOKEN_PEPPER:?EDGE_TOKEN_PEPPER is required in prod}
      # Fail-closed by default: only the literal string 'true' activates the
      # deprecated shared-token compatibility path, and only for the
      # migration window of an Edge that has not yet enrolled eft_v1
      # credentials. EDGE_LEGACY_FACILITY_ID must be set alongside it — the
      # legacy path never trusts a client-supplied facility scope.
      EDGE_LEGACY_COMPAT_ENABLED: ${EDGE_LEGACY_COMPAT_ENABLED:-}
      EDGE_LEGACY_FACILITY_ID: ${EDGE_LEGACY_FACILITY_ID:-}
      # SMTP_* configures outbound alert email delivery (nodemailer). Host/user/password
      # are required in prod; port/from/secure have sane defaults in the adapter.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in prod}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required in prod}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required in prod}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE-}
      # Deprecated shared bearer token for the legacy compatibility path
      # only (see EDGE_LEGACY_COMPAT_ENABLED above). Not required to boot:
      # eft_v1 per-installation credentials are the authoritative path and
      # do not depend on this value.
      EDGE_FACILITY_TOKEN: ${EDGE_FACILITY_TOKEN:-}
      # 세션 수명. 미설정 시 backend의 DEFAULT_JWT_TTL(30d)로 떨어진다.
      # 요양보호사 TV가 상시 로그인 상태를 유지해야 하므로 짧게 두지 말 것.
      JWT_TTL: ${JWT_TTL:-30d}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      NOKYANG_ADMIN_PASSWORD: ${NOKYANG_ADMIN_PASSWORD:-}
      SUPER_ADMIN_MANAGED_KEY: ${SUPER_ADMIN_MANAGED_KEY:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_BOOTSTRAP_SOURCE_EMAIL: ${SUPER_ADMIN_BOOTSTRAP_SOURCE_EMAIL:-}
      EVENT_CLIPS_ENABLED: ${EVENT_CLIPS_ENABLED:-false}
      MEDIA_CLIP_DIR: /app/backend/clips
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:?MEDIA_RETENTION_DAYS is required in prod}
      MEDIA_MIN_FREE_BYTES: ${MEDIA_MIN_FREE_BYTES:?MEDIA_MIN_FREE_BYTES is required in prod}
      MEDIA_CLIP_MAX_BYTES: ${MEDIA_CLIP_MAX_BYTES:?MEDIA_CLIP_MAX_BYTES is required in prod}
    ports: !reset []
    volumes:
      - snapshots:/app/backend/snapshots
      - clips:/app/backend/clips
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:8080/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s

  front:
    image: ${FRONT_IMAGE:?FRONT_IMAGE is required in prod}
    build: !reset null
    pull_policy: never
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  snapshots:
  clips:
