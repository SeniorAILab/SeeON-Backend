# Production overlay for the host stack (db + backend + front[nginx]).
# ML runs on the external edge device — see compose.edge.yaml.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required in prod} -d ${POSTGRES_DB:?POSTGRES_DB is required in prod}"]

  backend:
    build:
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:?APP_DB_USER is required in prod}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required in prod}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?schema=public
      FRONT_ORIGIN: ${FRONT_ORIGIN:?FRONT_ORIGIN is required in prod}
      ALERT_DASHBOARD_URL: ${ALERT_DASHBOARD_URL:?ALERT_DASHBOARD_URL is required in prod}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required in prod}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI is required in prod}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?SESSION_JWT_SECRET is required in prod}
      KAKAO_TOKEN_ENC_KEY: ${KAKAO_TOKEN_ENC_KEY:?KAKAO_TOKEN_ENC_KEY is required in prod}
    ports: !reset []

  front:
    build:
      target: runner
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports: !override
      - "80:3000"

  migrate:
    profiles: [migrate]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:?APP_DB_USER is required in prod}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required in prod}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?schema=public
    depends_on:
      db:
        condition: service_healthy
