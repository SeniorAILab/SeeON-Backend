name: Issue Auto-Label

# 신규/수정 이슈의 폼 "Type" 드롭다운을 정확히 하나의 `type:` 라벨로 매핑한다.
# 이 라벨은 `git wt <issue#>` 의 branch `<type>` 결정에 쓰인다(docs/rules/worktree-workflow.md).
# fail-closed: Type 이 없거나/알 수 없으면 라벨을 부여하지 않고 명시적으로 notice/warning 만 남긴다.
# 절대 `type: feat` 등 기본값으로 폴백하지 않는다.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  auto-label:
    name: Apply type label from issue Type
    runs-on: ubuntu-latest
    steps:
      - name: Map issue Type to type label (fail-closed)
        uses: actions/github-script@v7
        with:
          script: |
            // === ISSUE-AUTOLABEL-LOGIC-START ===
            const issue = context.payload.issue;
            if (!issue) {
              core.notice('No issue payload; skipping.');
              return;
            }

            const known = ['feat', 'fix', 'chore', 'docs', 'refactor', 'test'];
            const body = issue.body || '';
            const lines = body.split(/\r?\n/);

            // 폼은 "### Type" 헤딩 다음 비어있지 않은 줄에 선택값을 렌더한다.
            let rawValue = '';
            for (let i = 0; i < lines.length; i++) {
              if (/^#{1,6}\s*Type\s*$/i.test(lines[i].trim())) {
                for (let j = i + 1; j < lines.length; j++) {
                  if (lines[j].trim()) { rawValue = lines[j].trim(); break; }
                }
                break;
              }
            }

            // 옵션 형식: "feat — new feature or capability" → 첫 토큰이 prefix.
            const first = (rawValue.split(/\s+/)[0] || '').toLowerCase();

            // fail-closed: 누락/blank/unknown 이면 라벨 부여·cleanup 없이 종료. 기본값 폴백 금지.
            if (!rawValue || !known.includes(first)) {
              core.warning(
                `Issue #${issue.number}: Type 미상/누락 ("${rawValue}"). fail-closed — 라벨 미부여, cleanup 미실행, 기본값 폴백 없음.`
              );
              return;
            }
            const target = `type: ${first}`;

            const current = (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));

            // 정상 parse 일 때만: 다른 `type:` 라벨만 제거. domain:/priority:/size 등은 보존.
            for (const name of current) {
              if (name.startsWith('type:') && name !== target) {
                await github.rest.issues
                  .removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name,
                  })
                  .catch(() => {});
              }
            }

            if (!current.includes(target)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [target],
              });
            }

            core.notice(`Issue #${issue.number}: applied \`${target}\`.`);
            // === ISSUE-AUTOLABEL-LOGIC-END ===
