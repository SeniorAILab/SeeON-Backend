name: CI

# Build + test gate for PRs. Path-filtered per package (monorepo: backend, front, ml)
# so a frontend-only PR never spins up Postgres / runs backend jest, and vice
# versa. The always-run `ci-gate` job is the single required status check:
# skipped package jobs count as passing, which avoids the classic
# path-filter + required-check deadlock (skipped != success for required checks).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per PR; cancel superseded pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
      env_contract: ${{ steps.filter.outputs.env_contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/backend-guard/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'front/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            ml:
              - 'ml/**'
              - '.github/workflows/ci.yml'
            env_contract:
              - 'compose*.yaml'
              - '.env*.example'
              - 'scripts/env/**'
              - 'package.json'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (build + test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fall_app:fall_app@localhost:5432/fall_dev?schema=public
      DIRECT_URL: postgresql://fall:fall@localhost:5432/fall_dev?schema=public
      SESSION_JWT_SECRET: ci-session-secret-minimum-32-characters
      KAKAO_REST_API_KEY: ci-dummy-key
      KAKAO_REDIRECT_URI: http://localhost:3000/auth/kakao/callback
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fall
          POSTGRES_PASSWORD: fall
          POSTGRES_DB: fall_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fall -d fall_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 스키마↔마이그레이션 결합 검사가 base...HEAD diff 를 보려면 전체 히스토리 필요.
          fetch-depth: 0
      - name: Check migration order
        run: sh scripts/git-guard/check-migrations.sh main
      - name: Check schema↔migration coupling
        run: sh scripts/backend-guard/check-schema-migration.sh auto
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate
      - name: Create app role (fall_app)
        run: pnpm --filter backend exec prisma db execute --file prisma/init/01-create-app-role.sql --url "$DIRECT_URL"
      - name: Apply migrations
        run: pnpm --filter backend exec prisma migrate deploy
      # warn-first 롤아웃: lint 결과(경고 + 기존 error)를 로그에 노출하되 CI를 막지
      # 않는다. 기존 type-safety error 백로그(약 20건)를 소진한 뒤 블로킹으로 승격한다
      # (decision map follow-up). 경고는 ESLint/에디터로 항상 노출됨.
      - name: Backend lint guard (warn-first; non-blocking — see decision map)
        continue-on-error: true
        run: pnpm --filter backend run lint
      - name: Backend DTO contract guard
        run: pnpm --filter backend run dto:check
      - name: Typecheck
        run: pnpm --filter backend exec tsc --noEmit
      - name: Build
        run: pnpm --filter backend build
      - name: Test
        run: pnpm --filter backend test

  frontend:
    name: Frontend (build + lint + test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter front exec tsc --noEmit
      - name: Build
        run: pnpm --filter front build
      - name: Lint
        run: pnpm --filter front lint
      - name: Test
        run: pnpm --filter front test

  ml:
    name: ML (lint)
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff@0.15.17 check .
        working-directory: ml

  env-contract:
    name: Env contract
    needs: changes
    if: needs.changes.outputs.env_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production env contract
        run: node scripts/env/verify-compose-env-contract.mjs

  ci-gate:
    name: CI gate
    needs: [backend, frontend, ml, env-contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require package jobs to pass (skipped is allowed)
        run: |
          be='${{ needs.backend.result }}'
          fe='${{ needs.frontend.result }}'
          ml='${{ needs.ml.result }}'
          env_contract="${{ needs['env-contract'].result }}"
          echo "backend=$be frontend=$fe ml=$ml env_contract=$env_contract"
          for r in "$be" "$fe" "$ml" "$env_contract"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required package job did not pass"
              exit 1
            fi
          done
          echo "CI gate passed"
